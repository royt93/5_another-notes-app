plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "org.jetbrains.kotlin.plugin.allopen"
    id "androidx.navigation.safeargs.kotlin"
    id "com.github.triplet.play"
    id "com.github.breadmoirai.github-release"
    id "com.mikepenz.aboutlibraries.plugin"
    id "kotlin-parcelize"
    id "com.google.devtools.ksp"
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.mckimquyen.notes"

    defaultConfig {
        applicationId "com.mckimquyen.notes"
        minSdkVersion 24
        compileSdk 37
        targetSdkVersion 37
        versionCode 20260820
        versionName "2026.08.20"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        // AppLovin MAX IDs — kept configured but currently dormant. IS_ENABLE_ADMOB=true in both
        // buildTypes below makes AdMob the active provider; flipping that flag back to false would
        // make this set active again without needing to touch these values.
        buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
        buildConfigField "String", "APPLOVIN_BANNER_ID",       "\"9f19f76fe682443f\""
        buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"34eaf20efa37ac75\""
        buildConfigField "String", "APPLOVIN_APP_OPEN_ID",     "\"7153ba6828a2f672\""
        buildConfigField "String", "APPLOVIN_REWARDED_ID",     "\"8eecf725822d50b7\""

        // VIP redeem codes — Base64-obfuscated, decoded at runtime in RApp.setupAds(). These are
        // USER-FACING: handed out as activation codes, so they must never be reused as the SDK's
        // internal anti-tamper secret below (see VIP_SECRET_KEY_ENCODED).
        // Plain text NOT stored; raises bar for `strings` scans on APK (still reversible by determined attackers — adequate for low-stakes notes app).
        buildConfigField "String", "VIP_KEY_ENCODED", "\"OWZBMHE3ZU4hMjdjTHgwNEAyMTk5M1kydTBJNyNRMA==\""
        // Second redeem code (3-day grant), same obfuscation as VIP_KEY_ENCODED — see doc/ad/id.MD.
        buildConfigField "String", "VIP_KEY_3DAYS_ENCODED", "\"ZVE3QDkzTDBmITJZMjcwN3hOMDQwMjE5OTN1MEkjMmFL\""

        // AdSdkConfig.vipKeySecret — app-internal secret for the SDK's HMAC anti-tamper layer on the
        // VIP SharedPreferences entry, and the (now-disabled) legacy-plaintext-key path. Deliberately
        // a SEPARATE random value from the two redeem codes above: those are handed to end users as
        // activation codes, so reusing one here as the "secret" would let anyone who knows the public
        // code also forge the anti-tamper signature — defeats the whole point of the field. Random
        // 28-char value with mixed case/digit/special (ENH audit round, 2026-08-20).
        // Value lives in keystore.properties (gitignored, repo root) as `vipSecretKeyEncoded`, not
        // committed here — Security Checklist item, see AD_PROMPT_AOS.MD. Same pattern as the signing
        // secrets below. Fails the build loudly if missing rather than silently falling back, since a
        // wrong/placeholder secret here would silently break the SDK's anti-tamper check.
        def vipSecretKeyEncoded = keystoreProps.getProperty("vipSecretKeyEncoded")
        if (vipSecretKeyEncoded == null) {
            throw new GradleException(
                "Missing 'vipSecretKeyEncoded' in keystore.properties (repo root, gitignored). " +
                "Add it before building — see AD_PROMPT_AOS.MD Security Checklist for what this value is."
            )
        }
        buildConfigField "String", "VIP_SECRET_KEY_ENCODED", "\"${vipSecretKeyEncoded}\""

        // AdMob native — no admobNativeId field exists in AdSdkConfig (SDK doesn't support native ads
        // yet); stored here for whenever native ad support / a bespoke NativeAd integration is added.
        buildConfigField "String", "ADMOB_NATIVE_ID", "\"ca-app-pub-3004713799155145/3952263388\""
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/kotlin"
        }
        debug {
            java.srcDirs += "src/debug/kotlin"
        }
        release {
            java.srcDirs += "src/release/kotlin"
        }

        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            // Google's public demo AdMob ad unit IDs (ca-app-pub-3940256099942544 — safe test inventory,
            // shared by every AdMob integration for debug/QA). Real production IDs only live in release.
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"

//            applicationIdSuffix ".debug"
            def takingScreenshots = System.getenv("taking_screenshots")
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURES",
                    takingScreenshots == null ? "true" : (!takingScreenshots.toBoolean()).toString()
        }
        release {
            // nhớ check APPLICATION_ID trong manifest — account theo doc/ad/id.MD (2026-08-19)
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3004713799155145/2553169771\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3004713799155145/1240088100\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3004713799155145/4790702334\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3004713799155145/3202288498\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"

//            applicationIdSuffix ".sync"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURES", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += project.kotlinFlags
        freeCompilerArgs += [
                "-opt-in=kotlinx.serialization.ExperimentalSerializationApi",
        ]
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = defaultConfig.applicationId + buildType.name + "_" + defaultConfig.versionName + "_" + defaultConfig.versionCode + ".apk"
        }
    }

    flavorDimensions.add("type")

    productFlavors {

        dev {
//            applicationId = "com.mckimquyen.notes.dev"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')
            resValue("string", "app_name", "Cat Note DEV")

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "9f19f76fe682443f")
//            resValue("string", "INTER", "34eaf20efa37ac75")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

        production {
//            applicationId = "com.mckimquyen.notes"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')
            resValue("string", "app_name", "Cat Note")

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "9f19f76fe682443f")
//            resValue("string", "INTER", "34eaf20efa37ac75")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }

    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "com.maltaisn:recurpicker:2.1.7"
    implementation "com.mikepenz:aboutlibraries:10.9.2"
    implementation "com.mikepenz:aboutlibraries-core:10.9.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "com.google.dagger:dagger:2.52"
    ksp "com.google.dagger:dagger-compiler:2.52"
    ksp "androidx.room:room-compiler:2.7.0"
    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.9"
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.9"

    // AdmobApplovinWrapper SDK — AppLovin MAX + AdMob unified facade.
    // SDK pulls play-services-ads + AppLovin MAX + UMP transitively.
    implementation("com.github.royt93:AdmobApplovinWrapper:1.6.16")

    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")

    // Unit Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "org.robolectric:robolectric:4.12.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    // Integration & UI Testing (androidTest)
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.room:room-testing:2.7.0"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"

    // detekt.yml's `formatting:` ruleset needs this on the classpath, or detekt hard-fails with
    // "Property 'formatting' is misspelled or does not exist" before running any check.
    detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8"
}

tasks.named("build") {
    // don't test, don't lint, don't run detekt for build task.
    setDependsOn(getDependsOn().findAll { it != "check" })
}

allOpen {
    // ENH-A01: was "com.mckimquyen.notes.OpenClass", a custom annotation that never
    // resolved anywhere in the codebase — this plugin was silently a no-op. The classes
    // that actually need to be open for testing (PrefsManager, ReminderAlarmManager) use
    // the real androidx.annotation.OpenForTesting marker; point allOpen at that instead.
    annotation "androidx.annotation.OpenForTesting"
}

play {
    serviceAccountCredentials = file("fake-key.json")
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
if (file("publishing.gradle").exists()) {
    apply from: "publishing.gradle"
}

tasks.register("takeScreenshots", Exec) {
    commandLine "./screenshots.sh"
}
